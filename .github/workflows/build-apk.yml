# Construye el APK de la app Luna en GitHub (gratis, repositorio público).
# Se ejecuta al cambiar cualquier archivo de android/ o este mismo archivo,
# y también se puede lanzar a mano desde la pestaña Actions.
name: Build APK

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Gradle 8.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Apuntar al SDK de Android del runner
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Construir el APK de depuración
        run: gradle :app:assembleDebug --no-daemon
        working-directory: android

      - name: Publicar el APK
        uses: actions/upload-artifact@v4
        with:
          name: luna-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
